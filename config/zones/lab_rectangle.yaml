# Example: rectangular detection zone of the IRI lab (TIAGo Pro map, 2026-10-14).
# x=[1.0,8.5], y=[-3.3,1.3]; excludes chairs/tables at (2.9,1.8) and (6.5,-3.7).
# Only meaningful on our map: make your own zone for your map (see README).
frame: map
zones:
  - name: lab_rectangle
    add: true
    x_min: 1.0
    x_max: 8.5
    y_min: -3.3
    y_max: 1.3
